name: EmDash Gold Image Factory - Worker Bundle Builder

on:
  workflow_dispatch:
    inputs:
      version:
        description: "欲編譯的 EmDash 官方版本標籤 (例如: v1.3.1 或 emdash@1.3.1)"
        required: true
        default: "v1.3.1"
        type: string
      r2_bucket:
        description: "目標 Cloudflare R2 儲存庫名稱"
        required: true
        default: "fastblog-media"
        type: string
      enable_canary_tag:
        description: "是否同步發布為 latest 金像 (標記為系統預設開站映像檔)"
        required: true
        default: true
        type: boolean
      build_wp_plugin:
        description: "是否同步打包官方 wp-emdash 搬家外掛"
        required: true
        default: true
        type: boolean

jobs:
  build-and-package-gold-image:
    name: Build Astro SSR Gold Image & Ship to R2
    runs-on: ubuntu-latest
    steps:
      - name: 1. 解析輸入參數與版本號規範化
        id: parse-version
        run: |
          RAW_VER="${{ inputs.version }}"
          CLEAN_VER=$(echo "${RAW_VER}" | sed -E 's/.*@//; s/^v//')
          echo "RAW_VER=${RAW_VER}" >> $GITHUB_ENV
          echo "CLEAN_VER=${CLEAN_VER}" >> $GITHUB_ENV
          echo "NORMALIZED_TAG=v${CLEAN_VER}" >> $GITHUB_ENV
          echo "BUCKET=${{ inputs.r2_bucket }}" >> $GITHUB_ENV

      - name: 2. 克隆官方 EmDash Monorepo 儲存庫
        run: |
          rm -rf official-emdash
          CLONED=0
          for REF in "${RAW_VER}" "emdash@${CLEAN_VER}" "v${CLEAN_VER}" "${CLEAN_VER}" "@emdash-cms/admin@${CLEAN_VER}"; do
            if git clone --depth 1 --branch "${REF}" https://github.com/emdash-cms/emdash.git official-emdash 2>/dev/null; then
              CLONED=1
              break
            fi
          done
          if [ $CLONED -eq 0 ]; then
            git clone --depth 1 https://github.com/emdash-cms/emdash.git official-emdash
          fi

      - name: 3. 設定 Node.js 22 LTS 與 pnpm 9 環境
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 3.1 安裝 pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9
          run_install: false

      - name: 4. 安裝 Monorepo 全域依賴項
        working-directory: official-emdash
        run: |
          export NODE_OPTIONS="--max-old-space-size=4096"
          pnpm install --no-frozen-lockfile

      - name: 5. Astro SSR Worker 金像核心編譯 (Gold Image Compilation)
        working-directory: official-emdash
        run: |
          export NODE_OPTIONS="--max-old-space-size=4096"
          pnpm --filter "...@emdash-cms/core" build || true
          pnpm --filter "...@emdash-cms/admin" build || true
          pnpm --filter "...@emdash-cms/astro" build || true

          mkdir -p ../gold_image_dist
          WORKER_FOUND=0

          if [ -d "demos/cloudflare" ]; then
            cd demos/cloudflare
            pnpm install --no-frozen-lockfile || true
            pnpm run build || npx astro build
            cd ../..
            for cand in "demos/cloudflare/dist/_worker.js" "demos/cloudflare/dist/_worker.js/index.js"; do
              if [ -f "$cand" ]; then
                cp "$cand" ../gold_image_dist/emdash-v${CLEAN_VER}.js
                WORKER_FOUND=1
                break
              fi
            done
          fi
          test $WORKER_FOUND -eq 1 || exit 1

      - name: 6. 驗證金像完整度並生成 Manifest 元數據清單
        run: |
          cd gold_image_dist
          TARGET_FILE="emdash-v${CLEAN_VER}.js"
          test -s "${TARGET_FILE}" || exit 1
          FILE_BYTES=$(wc -c < "${TARGET_FILE}")
          SHA256_HASH=$(sha256sum "${TARGET_FILE}" | awk '{print $1}')
          cat << EOF > manifest.json
          {
            "schemaVersion": "2.0",
            "imageType": "emdash-astro-ssr-worker",
            "version": "v${CLEAN_VER}",
            "cleanVersion": "${CLEAN_VER}",
            "goldImageKey": "system/gold-images/${TARGET_FILE}",
            "fileSize": ${FILE_BYTES},
            "sha256": "${SHA256_HASH}",
            "builtAt": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")",
            "compatibilityDate": "2024-09-23",
            "compatibilityFlags": ["nodejs_compat"],
            "themesSupported": ["blog", "portfolio", "marketing"],
            "status": "ready"
          }
          EOF

      - name: 7. 上傳金像代碼與 Manifest 至 Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          BUCKET="${{ env.BUCKET }}"
          CF_ACCOUNT_ID="${{ secrets.CF_ACCOUNT_ID }}"
          ENDPOINT="https://${CF_ACCOUNT_ID}.r2.cloudflarestorage.com"
          TARGET_DIR="s3://${BUCKET}/system/gold-images"
          aws s3 cp gold_image_dist/emdash-v${CLEAN_VER}.js "${TARGET_DIR}/emdash-v${CLEAN_VER}.js" --endpoint-url "${ENDPOINT}" --cache-control "public, max-age=31536000, immutable"
          aws s3 cp gold_image_dist/manifest.json "${TARGET_DIR}/manifest.json" --endpoint-url "${ENDPOINT}" --cache-control "no-cache"

      - name: 8. 打包並上傳官方 wp-emdash 搬家外掛
        if: ${{ inputs.build_wp_plugin }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          git clone --depth 1 https://github.com/emdash-cms/wp-emdash.git wp-emdash-src
          mkdir -p packaging/wp-emdash
          cp -r wp-emdash-src/* packaging/wp-emdash/
          cd packaging && zip -r ../wp-emdash.zip wp-emdash -x "*.git*" && cd ..
          ENDPOINT="https://${{ secrets.CF_ACCOUNT_ID }}.r2.cloudflarestorage.com"
          aws s3 cp wp-emdash.zip "s3://${{ env.BUCKET }}/system/tools/wp-emdash.zip" --endpoint-url "${ENDPOINT}"
