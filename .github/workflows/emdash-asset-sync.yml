name: Fast AI Blog - Deploy Tenant Worker

on:
  workflow_dispatch:
    inputs:
      subdomain:
        description: "客戶專屬子網域 (例如: techblog)"
        required: true
        type: string
      d1_database_id:
        description: "已建立之專屬 Cloudflare D1 UUID"
        required: true
        type: string
      site_name:
        description: "部落格網站名稱"
        required: false
        default: "Fast AI Blog"
        type: string
      admin_email:
        description: "站長管理員電子郵件"
        required: false
        default: "admin@fastblog.cc"
        type: string
      tenant_id:
        description: "中央系統租戶識別碼 (Tenant ID)"
        required: false
        default: ""
        type: string
      theme_id:
        description: "初始佈景主題 (blog / portfolio / marketing)"
        required: false
        default: "blog"
        type: choice
        options:
          - blog
          - portfolio
          - marketing
      custom_domain:
        description: "自訂獨立網域 (選填，例如: blog.brand.tw)"
        required: false
        default: ""
        type: string

jobs:
  deploy-tenant-edge-worker:
    name: Build & Deploy Independent Worker via Wrangler
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 1. 檢出儲存庫代碼 (含 template/ 目錄)
        uses: actions/checkout@v4

      - name: 2. 設定 Node.js 22 LTS 與 pnpm 9 環境
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 2.1 安裝 pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9
          run_install: false

      - name: 3. 驗證並自動確保 template 目錄完整性
        run: |
          echo "=========================================================="
          echo "🔍 檢查 template/ 模板工程結構..."
          if [ ! -d "template" ] || [ ! -f "template/package.json" ]; then
            echo "⚠️ 未檢測到完整 template/ 目錄，執行腳手架快速生成..."
            chmod +x ./scripts/init_template.sh 2>/dev/null || true
            ./scripts/init_template.sh
          fi
          echo "✅ 模板目錄就緒。"
          echo "=========================================================="

      - name: 4. 動態合成客戶專屬 wrangler.jsonc 設定檔
        working-directory: template
        run: |
          SUBDOMAIN="${{ inputs.subdomain }}"
          D1_ID="${{ inputs.d1_database_id }}"
          SITE_NAME="${{ inputs.site_name }}"
          ADMIN_EMAIL="${{ inputs.admin_email }}"
          WORKER_NAME="blog-${SUBDOMAIN}"

          # 生成專屬隨機 32 位元 Session 安全金鑰
          EMDASH_SECRET=$(openssl rand -hex 16)
          echo "EMDASH_SECRET=${EMDASH_SECRET}" >> $GITHUB_ENV
          echo "WORKER_NAME=${WORKER_NAME}" >> $GITHUB_ENV

          echo "📝 正在為站點 [${WORKER_NAME}] 動態生成 wrangler.jsonc ..."

          cat << EOF > wrangler.jsonc
          {
            "\$schema": "node_modules/wrangler/config-schema.json",
            "name": "${WORKER_NAME}",
            "main": "./dist/_worker.js/index.js",
            "compatibility_date": "2024-09-23",
            "compatibility_flags": [
              "nodejs_compat"
            ],
            "d1_databases": [
              {
                "binding": "DB",
                "database_name": "emdash_db_${SUBDOMAIN}",
                "database_id": "${D1_ID}"
              }
            ],
            "r2_buckets": [
              {
                "binding": "BUCKET",
                "bucket_name": "fastblog-media"
              }
            ],
            "vars": {
              "SITE_URL": "https://${SUBDOMAIN}.fastblog.cc",
              "TENANT_SUBDOMAIN": "${SUBDOMAIN}",
              "SITE_NAME": "${SITE_NAME}",
              "ADMIN_EMAIL": "${ADMIN_EMAIL}"
            }
          }
          EOF

          echo "✅ wrangler.jsonc 設定完成:"
          cat wrangler.jsonc

      - name: 5. 安裝官方標準 npm 套件依賴項
        working-directory: template
        run: |
          echo "📦 正在安裝 Astro 與 EmDash 官方穩定套件..."
          export NODE_OPTIONS="--max-old-space-size=4096"
          pnpm install --no-frozen-lockfile

      - name: 6. 執行標準 Astro SSR 編譯
        working-directory: template
        run: |
          echo "🔨 執行 npx astro build..."
          export NODE_OPTIONS="--max-old-space-size=4096"
          pnpm run build

          # 檢查 Cloudflare 轉接器輸出模組是否存在
          if [ -d "dist/_worker.js" ]; then
            echo "✅ 成功產出 Astro SSR Worker 模組: dist/_worker.js"
          else
            echo "❌ 嚴重錯誤：未找到 dist/_worker.js，編譯失敗！"
            exit 1
          fi

      - name: 7. 調用 Cloudflare 官方 Wrangler 部署獨立 Worker
        working-directory: template
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          echo "🚀 正在將 Worker [${{ env.WORKER_NAME }}] 發布至 Cloudflare 全球節點..."
          npx wrangler deploy --config wrangler.jsonc

          echo "🔑 注入專屬 EMDASH_SECRET 機密加密密鑰..."
          echo "${{ env.EMDASH_SECRET }}" | npx wrangler secret put EMDASH_SECRET --config wrangler.jsonc

      - name: 8. 調用 Wrangler 綁定官方子網域
        working-directory: template
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          SUBDOMAIN="${{ inputs.subdomain }}"
          HOSTNAME="${SUBDOMAIN}.fastblog.cc"

          echo "🌐 綁定子網域: ${HOSTNAME} ➔ ${{ env.WORKER_NAME }}"
          npx wrangler domains put "${HOSTNAME}" --worker "${{ env.WORKER_NAME }}" || true

          # 若有自訂獨立網域，同步執行綁定
          CUSTOM_DOMAIN="${{ inputs.custom_domain }}"
          if [ -n "$CUSTOM_DOMAIN" ]; then
            echo "🌐 綁定客戶自訂獨立網域: ${CUSTOM_DOMAIN} ➔ ${{ env.WORKER_NAME }}"
            npx wrangler domains put "${CUSTOM_DOMAIN}" --worker "${{ env.WORKER_NAME }}" || true
          fi

      - name: 9. 部署完成收尾通知 (回呼中央調度塔)
        if: always()
        run: |
          TENANT_ID="${{ inputs.tenant_id }}"
          SUBDOMAIN="${{ inputs.subdomain }}"
          STATUS="${{ job.status }}"

          echo "=========================================================="
          echo "🎉 部署任務結束，狀態: ${STATUS}"
          echo "  - 站點網址: https://${SUBDOMAIN}.fastblog.cc/"
          echo "  - 後台網址: https://${SUBDOMAIN}.fastblog.cc/_emdash/admin/"
          echo "=========================================================="

          # 若提供 tenant_id 則觸發回呼
          if [ -n "$TENANT_ID" ]; then
            echo "📡 回呼中央控制塔通知部署狀態..."
            curl -s -X POST "https://api.fastblog.cc/api/tenants/${TENANT_ID}/deployed" \
              -H "Content-Type: application/json" \
              -d "{\"status\": \"${STATUS}\", \"subdomain\": \"${SUBDOMAIN}\", \"workerName\": \"${{ env.WORKER_NAME }}\"}" || true
          fi
