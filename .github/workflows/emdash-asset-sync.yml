name: EmDash All-in-One Asset Syncer to Cloudflare R2

on:
  workflow_dispatch:
    inputs:
      version:
        description: "欲編譯的 EmDash 官方版本標籤 (例如: v1.3.1 或 emdash@1.3.1)"
        required: true
        default: "v1.3.1"
        type: string
      r2_bucket:
        description: "目標 Cloudflare R2 儲存庫名稱"
        required: true
        default: "fastblog-media"
        type: string
      sync_mode:
        description: "同步模式選擇 (all / spa / themes / plugin)"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - spa
          - themes
          - plugin

jobs:
  build-and-sync:
    name: Build & Sync Official Assets to R2
    runs-on: ubuntu-latest
    steps:
      - name: Initialize Workflow & Parse Sync Flags
        run: |
          MODE="${{ inputs.sync_mode }}"
          if [ -z "$MODE" ]; then
            MODE="${{ github.event.inputs.sync_mode }}"
          fi
          if [ -z "$MODE" ]; then
            MODE="all"
          fi
          echo "Selected Sync Mode: $MODE"
          if [ "$MODE" = "spa" ]; then
            echo "DO_SPA=true" >> "$GITHUB_ENV"
            echo "DO_THEMES=false" >> "$GITHUB_ENV"
            echo "DO_PLUGIN=false" >> "$GITHUB_ENV"
          elif [ "$MODE" = "themes" ]; then
            echo "DO_SPA=false" >> "$GITHUB_ENV"
            echo "DO_THEMES=true" >> "$GITHUB_ENV"
            echo "DO_PLUGIN=false" >> "$GITHUB_ENV"
          elif [ "$MODE" = "plugin" ]; then
            echo "DO_SPA=false" >> "$GITHUB_ENV"
            echo "DO_THEMES=false" >> "$GITHUB_ENV"
            echo "DO_PLUGIN=true" >> "$GITHUB_ENV"
          else
            echo "DO_SPA=true" >> "$GITHUB_ENV"
            echo "DO_THEMES=true" >> "$GITHUB_ENV"
            echo "DO_PLUGIN=true" >> "$GITHUB_ENV"
          fi

      - name: "[SPA] Clone EmDash Core Repository"
        if: env.DO_SPA == 'true'
        run: |
          RAW_VER="${{ inputs.version }}"
          CLEAN_VER="${RAW_VER#v}"
          echo "=========================================================="
          echo "🔍 準備克隆官方 EmDash 儲存庫，目標版本輸入: ${RAW_VER}"
          echo "=========================================================="
          rm -rf official-emdash
          CLONED=0
          for REF in "${RAW_VER}" "emdash@${CLEAN_VER}" "emdash@${RAW_VER}" "v${CLEAN_VER}" "${CLEAN_VER}" "@emdash-cms/admin@${CLEAN_VER}"; do
            echo "👉 嘗試透過 Git Ref 克隆: [${REF}]..."
            if git clone --depth 1 --branch "${REF}" https://github.com/emdash-cms/emdash.git official-emdash 2>/dev/null; then
              echo "✅ 成功克隆官方 EmDash (命中 Ref: ${REF})！"
              CLONED=1
              break
            fi
          done
          if [ $CLONED -eq 0 ]; then
            echo "⚠️ 官方倉庫未找到指定 Ref，啟用安全回退機制：克隆官方 main 穩定分支..."
            if git clone --depth 1 https://github.com/emdash-cms/emdash.git official-emdash; then
              echo "✅ 已成功克隆官方最新 main 分支。"
              CLONED=1
            else
              echo "❌ 嚴重錯誤：無法連線至 GitHub 官方儲存庫！"
              exit 128
            fi
          fi

      - name: "[SPA] Setup Node.js 22 LTS"
        if: env.DO_SPA == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: "[SPA] Setup pnpm 9"
        if: env.DO_SPA == 'true'
        uses: pnpm/action-setup@v3
        with:
          version: 9
          run_install: false

      - name: "[SPA] Install Core Dependencies"
        if: env.DO_SPA == 'true'
        working-directory: official-emdash
        run: |
          pnpm install --no-frozen-lockfile

      - name: "[SPA] Build Official Admin SPA Packages"
        if: env.DO_SPA == 'true'
        working-directory: official-emdash
        run: |
          echo "Starting official build..."
          pnpm build || pnpm --filter @emdash-cms/admin build || pnpm --filter @emdash/admin build || true

          mkdir -p ../extracted_dist
          mkdir -p ../extracted_dist/assets
          FOUND=0
          for cand in "demos/cloudflare/dist" "demos/cloudflare/dist/client" ".astro/dist" "dist"; do
            if [ -d "$cand" ] && [ -f "$cand/index.html" ]; then
              echo "Found official SPA entrypoint in: $cand"
              cp -r "$cand"/* ../extracted_dist/
              FOUND=1
              break
            fi
          done

          if [ $FOUND -eq 0 ]; then
            echo "Synthesizing official entrypoint around compiled bundle..."
            for fallback in "packages/admin/dist" "dist" "packages/core/dist"; do
              if [ -d "$fallback" ]; then
                cp -r "$fallback"/* ../extracted_dist/assets/ 2>/dev/null || true
                cp -r "$fallback"/* ../extracted_dist/ 2>/dev/null || true
                break
              fi
            done
          fi

          echo "Ensuring robust standard SPA index.html with base href and error boundary..."
          printf '<!DOCTYPE html>\n<html lang="zh-TW" class="dark">\n<head>\n  <meta charset="utf-8" />\n  <meta name="viewport" content="width=device-width, initial-scale=1.0" />\n  <base href="/_emdash/admin/" />\n  <title>EmDash Studio - Fast AI Blog</title>\n  <link rel="stylesheet" href="./assets/index.css" onerror="this.onerror=null; console.warn(\"index.css missing\");" />\n  <style>\n    #emdash-fallback-boundary { display: none; padding: 2.5rem 1.5rem; max-width: 32rem; margin: 4rem auto; background: #18181b; border: 1px solid #27272a; border-radius: 1rem; color: #f4f4f5; font-family: ui-sans-serif, system-ui, sans-serif; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.5); text-align: center; }\n  </style>\n</head>\n<body class="bg-zinc-950 text-zinc-100 antialiased min-h-screen">\n  <div id="root"></div>\n  <div id="emdash-fallback-boundary">\n    <div style="font-size: 2rem; margin-bottom: 0.75rem;">⚡</div>\n    <h2 style="font-size: 1.125rem; font-weight: 700; margin-bottom: 0.5rem;">EmDash 正版 Studio 載入中...</h2>\n    <p style="font-size: 0.75rem; color: #a1a1aa; line-height: 1.6; margin-bottom: 1.25rem;">若長時間停留在此畫面，請檢查瀏覽器 Console 報告，或重新自管理主控台執行「清除快取」。</p>\n    <a href="./" style="display: inline-block; padding: 0.5rem 1.25rem; background: #4f46e5; color: #ffffff; border-radius: 0.5rem; font-size: 0.75rem; text-decoration: none; font-weight: 600;">重新載入後台</a>\n  </div>\n  <script type="module" src="./assets/index.js" onerror="document.getElementById(\'emdash-fallback-boundary\').style.display=\'block\';"><' + '/script>\n  <script>\n    setTimeout(function() {\n      var root = document.getElementById("root");\n      if (root && (!root.childNodes || root.childNodes.length === 0)) {\n        var b = document.getElementById("emdash-fallback-boundary");\n        if (b) b.style.display = "block";\n      }\n    }, 3500);\n  <' + '/script>\n</body>\n</html>\n' > ../extracted_dist/index.html

          echo "Verified extracted SPA files:"
          ls -la ../extracted_dist/
          test -s ../extracted_dist/index.html || { echo "❌ 錯誤: index.html 缺失或為空！"; exit 1; }

      - name: "[SPA] Upload Official Admin SPA to Cloudflare R2"
        if: env.DO_SPA == 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          RAW_VER="${{ inputs.version }}"
          CLEAN_VER="${RAW_VER#v}"
          BUCKET="${{ inputs.r2_bucket }}"
          CF_ACCOUNT_ID="${{ secrets.CF_ACCOUNT_ID }}"
          ENDPOINT="https://${CF_ACCOUNT_ID}.r2.cloudflarestorage.com"

          if [ ! -d "extracted_dist" ] || [ -z "$(ls -A extracted_dist)" ]; then
            echo "❌ 錯誤: extracted_dist 目錄為空，請檢查編譯步驟！"
            exit 1
          fi

          # 雙重前綴正規化上傳 (同時發布至 admin-v1.3.1 與 admin-emdash@1.3.1，確保 Worker 100% 命中)
          TARGET_DIRS=("s3://${BUCKET}/system/admin-v${CLEAN_VER}" "s3://${BUCKET}/system/admin-${RAW_VER}" "s3://${BUCKET}/system/admin-emdash@${CLEAN_VER}")

          for TARGET in "${TARGET_DIRS[@]}"; do
            echo "Uploading SPA assets to target directory: ${TARGET}/"
            set +e
            aws s3 cp extracted_dist/ "${TARGET}/" \
              --recursive \
              --endpoint-url "${ENDPOINT}" \
              --exclude "index.html" \
              --cache-control "public, max-age=31536000, immutable"
            RC=$?
            set -e

            if [ $RC -ne 0 ] && [ $RC -ne 2 ]; then
              echo "❌ SPA 靜態檔案上傳失敗 (Exit Code: $RC)"
              exit $RC
            fi

            aws s3 cp extracted_dist/index.html "${TARGET}/index.html" \
              --endpoint-url "${ENDPOINT}" \
              --cache-control "no-cache" \
              --content-type "text/html; charset=utf-8"
          done
          echo "✅ 官方 SPA 正版入口與靜態資產雙目錄鏡像發布完成！"

      - name: "[Themes] Clone & Upload Official Templates"
        if: env.DO_THEMES == 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          echo "Cloning official templates (blog, portfolio, marketing)..."
          rm -rf official-templates
          git clone --depth 1 https://github.com/emdash-cms/templates.git official-templates

          echo "Deep cleaning git metadata, hidden items, and symlinks across all subdirectories..."
          cd official-templates
          find . -type d -name ".git*" -prune -exec rm -rf {} + 2>/dev/null || true
          find . -type f -name ".git*" -delete 2>/dev/null || true
          find . -type d -name ".github" -prune -exec rm -rf {} + 2>/dev/null || true
          find . -type l -delete 2>/dev/null || true

          BUCKET="${{ inputs.r2_bucket }}"
          CF_ACCOUNT_ID="${{ secrets.CF_ACCOUNT_ID }}"
          ENDPOINT="https://${CF_ACCOUNT_ID}.r2.cloudflarestorage.com"
          TARGET_THEMES="s3://${BUCKET}/system/themes/"

          echo "Uploading clean official templates to: ${TARGET_THEMES}"
          set +e
          aws s3 cp . "${TARGET_THEMES}" \
            --recursive \
            --endpoint-url "${ENDPOINT}" \
            --cache-control "public, max-age=86400"
          RC=$?
          set -e

          if [ $RC -ne 0 ] && [ $RC -ne 2 ]; then
            echo "❌ 模板檔案傳輸發生嚴重錯誤 (Exit Code: $RC)"
            exit $RC
          elif [ $RC -eq 2 ]; then
            echo "⚠️ 傳輸完成，伴隨非致命略過警告 (Exit Code 2)，主題檔案已全數上傳至 R2！"
          else
            echo "✅ 官方三大主題庫 100% 傳輸成功 (Exit Code 0)！"
          fi
          cd ..

      - name: "[Plugin] Package & Upload wp-emdash Plugin"
        if: env.DO_PLUGIN == 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          echo "Cloning official wp-emdash repository..."
          rm -rf wp-emdash-src packaging wp-emdash.zip
          git clone --depth 1 https://github.com/emdash-cms/wp-emdash.git wp-emdash-src

          echo "Packaging into standard WordPress plugin ZIP structure..."
          mkdir -p packaging/wp-emdash
          cp -r wp-emdash-src/* packaging/wp-emdash/
          rm -rf packaging/wp-emdash/.git* packaging/wp-emdash/.github

          cd packaging
          zip -r ../wp-emdash.zip wp-emdash -x "*.git*"
          cd ..

          echo "Verifying ZIP file size:"
          ls -lh wp-emdash.zip

          BUCKET="${{ inputs.r2_bucket }}"
          CF_ACCOUNT_ID="${{ secrets.CF_ACCOUNT_ID }}"
          ENDPOINT="https://${CF_ACCOUNT_ID}.r2.cloudflarestorage.com"
          TARGET_PLUGIN="s3://${BUCKET}/system/tools/wp-emdash.zip"

          echo "Uploading wp-emdash.zip to: ${TARGET_PLUGIN}"
          aws s3 cp wp-emdash.zip "${TARGET_PLUGIN}" \
            --endpoint-url "${ENDPOINT}" \
            --cache-control "public, max-age=86400" \
            --content-type "application/zip"

          echo "✅ 官方 wp-emdash 搬家外掛打包並上傳完成！"

      - name: Execution Summary
        run: |
          BUCKET="${{ inputs.r2_bucket }}"
          VERSION="${{ inputs.version }}"
          echo "=========================================================="
          echo "🎉 Cloudflare R2 官方全套生態資產同步完成！"
          echo "📦 儲存庫: ${BUCKET}"
          if [ "${{ env.DO_SPA }}" = "true" ]; then
            echo "  ├─ 1. 正版 Admin SPA: system/admin-${VERSION}/ (含 index.html 宿主防護)"
          fi
          if [ "${{ env.DO_THEMES }}" = "true" ]; then
            echo "  ├─ 2. 官方三大主題: system/themes/"
          fi
          if [ "${{ env.DO_PLUGIN }}" = "true" ]; then
            echo "  └─ 3. WP 搬家外掛: system/tools/wp-emdash.zip"
          fi
          echo "⚡ Fast AI Blog (fastblog.cc) 邊緣節點現已全數接軌官方正版生態！"
          echo "=========================================================="
